<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeciAlerta</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-gradient-splash {
            background: linear-gradient(180deg, #581C87 0%, #7E22CE 35%, #D916F0 65%, #FF7F5C 100%);
        }
    </style>
</head>
<body class="bg-gradient-splash min-h-screen flex flex-col justify-between items-center py-6 px-6 font-sans relative overflow-x-hidden">

    <!-- Barra de Estado Falsa (Estilo Móvil) -->
    <div class="w-full max-w-sm flex justify-between items-center text-white font-medium text-sm pt-1 z-10">
        <div>9:15 PM</div>
        <div class="flex items-center space-x-1.5">
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 10.5C1 9.39543 1.89543 8.5 3 8.5H3.90909C5.01366 8.5 5.90909 9.39543 5.90909 10.5V11C5.90909 11.5523 5.46137 12 4.90909 12H3C2.44772 12 2 11.5523 2 11V10.5C2 10.5 2 10.5 1 10.5Z" fill="white"/><path d="M8.09091 5.5C8.09091 4.39543 8.98634 3.5 10.0909 3.5H11C12.1046 3.5 13 4.39543 13 5.5V11C13 11.5523 12.5523 12 12 12H10.9091C10.3568 12 9.90909 11.5523 9.90909 11V5.5C9.90909 5.5 9.90909 5.5 8.09091 5.5Z" fill="white"/><path d="M13 1C13 0.447715 13.4477 0 14 0H15.0909C15.6432 0 16.0909 0.447715 16.0909 1V11C16.0909 11.5523 15.6432 12 15.0909 12H14C13.4477 12 13 11.5523 13 11V1C13 1 13 1 13 1Z" fill="white"/></svg>
            <svg width="22" height="11" viewBox="0 0 25 11" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="white"/><path d="M23 3.5V7.5" stroke="white" stroke-linecap="round"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="white"/></svg>
        </div>
    </div>

    <!-- ================= VISTA 1: INICIO DE SESIÓN ================= -->
    <div id="vista-login" class="w-full max-w-sm flex flex-col items-center my-auto z-10">
        
        <!-- Círculo con el Ícono del Mapa -->
        <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-xl mb-8">
            <svg class="w-16 h-16 text-gray-800" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                <circle cx="15" cy="9" r="1.5" fill="currentColor"></circle>
            </svg>
        </div>

        <!-- Formulario de Acceso -->
        <div class="w-full px-4 space-y-4">
            <div>
                <label class="block text-white text-base font-medium mb-1">Usuario:</label>
                <input type="text" id="login-usuario" class="w-full bg-transparent border-b border-white/60 text-white pb-1 focus:outline-none focus:border-white">
            </div>

            <div>
                <label class="block text-white text-base font-medium mb-1">Contraseña:</label>
                <input type="password" id="login-password" class="w-full bg-transparent border-b border-white/60 text-white pb-1 focus:outline-none focus:border-white">
            </div>

            <div class="pt-3 flex flex-col items-center">
                <button onclick="realizarAcceso()" class="w-48 bg-white text-gray-900 font-medium py-2.5 rounded-xl shadow-md hover:bg-gray-100 transition">
                    Acceso
                </button>
                <a href="#" class="text-white text-xs mt-2 opacity-90 hover:underline">Has olvidado tu contraseña</a>
            </div>

            <div class="pt-4 flex flex-col items-center">
                <button onclick="cambiarVista('registro', event)" class="w-48 bg-white text-gray-900 font-medium py-2.5 rounded-xl shadow-md hover:bg-gray-100 transition">
                    Crear
                </button>
                <span class="text-white text-xs mt-2 opacity-90">¿No tienes una cuenta?</span>
            </div>
        </div>
    </div>


    <!-- ================= VISTA 2: CREAR / REGISTRAR USUARIO ================= -->
    <div id="vista-registro" class="w-full max-w-sm flex flex-col items-center my-auto z-10 hidden">
        
        <!-- Ícono de Usuario con el signo más (+) -->
        <div class="relative mb-6">
            <div class="w-24 h-24 bg-cyan-300 rounded-full flex items-center justify-center shadow-lg">
                <svg class="w-12 h-12 text-teal-900" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="absolute bottom-0 right-0 w-9 h-9 bg-slate-100 rounded-full flex items-center justify-center shadow-md border-2 border-purple-900">
                <span class="text-xl font-bold text-gray-800">+</span>
            </div>
        </div>

        <!-- Formulario de Registro con selección de Rol -->
        <div class="w-full px-4 space-y-3">
            <div>
                <label class="block text-white text-sm font-medium">Nombre:</label>
                <input type="text" id="reg-nombre" class="w-full bg-transparent border-b border-white/60 text-white pb-0.5 focus:outline-none focus:border-white">
            </div>

            <div>
                <label class="block text-white text-sm font-medium">Usuario:</label>
                <input type="text" id="reg-usuario" class="w-full bg-transparent border-b border-white/60 text-white pb-0.5 focus:outline-none focus:border-white">
            </div>

            <div>
                <label class="block text-white text-sm font-medium">Contraseña:</label>
                <input type="password" id="reg-password" class="w-full bg-transparent border-b border-white/60 text-white pb-0.5 focus:outline-none focus:border-white">
            </div>

            <div>
                <label class="block text-white text-sm font-medium">Teléfono:</label>
                <input type="tel" id="reg-telefono" class="w-full bg-transparent border-b border-white/60 text-white pb-0.5 focus:outline-none focus:border-white">
            </div>

            <div>
                <label class="block text-white text-sm font-medium">Dirección:</label>
                <input type="text" id="reg-direccion" class="w-full bg-transparent border-b border-white/60 text-white pb-0.5 focus:outline-none focus:border-white">
            </div>

            <!-- Nuevo campo para elegir el Rol -->
            <div>
                <label class="block text-white text-sm font-medium">Rol (ID):</label>
                <select id="reg-rol" class="w-full bg-purple-900/60 border-b border-white/60 text-white py-1 px-2 rounded focus:outline-none focus:border-white">
                    <option value="1" class="bg-purple-900 text-white">1 - Vecino</option>
                    <option value="2" class="bg-purple-900 text-white">2 - Administrador</option>
                </select>
            </div>

            <!-- Botón de enviar (Flecha) -->
            <div class="pt-4 flex justify-between items-center px-4">
                <button onclick="cambiarVista('login', event)" class="text-white text-xs underline opacity-80">Volver</button>
                <button onclick="registrarUsuario()" class="w-12 h-12 bg-indigo-500 rounded-full flex items-center justify-center text-white shadow-lg hover:bg-indigo-600 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Indicador inferior de iPhone -->
    <div class="w-32 h-1 bg-white/50 rounded-full mx-auto mt-2 z-10"></div>

    <script>
        const API_BASE = "https://veci-alerta-api-1.onrender.com/api";

        // Función para alternar entre las vistas
        function cambiarVista(vista, event) {
            if (event) event.preventDefault();
            
            const loginView = document.getElementById('vista-login');
            const registroView = document.getElementById('vista-registro');

            if (vista === 'registro') {
                loginView.classList.add('hidden');
                registroView.classList.remove('hidden');
            } else {
                registroView.classList.add('hidden');
                loginView.classList.remove('hidden');
            }
        }

        // Función de acceso (Login)
        function realizarAcceso() {
            const user = document.getElementById('login-usuario').value;
            if(!user) {
                alert("Por favor ingresa tu usuario");
                return;
            }
            alert("Iniciando sesión para: " + user);
        }

        // Función para registrar el usuario incluyendo el rol seleccionado
        async function registrarUsuario() {
            const nombre = document.getElementById('reg-nombre').value;
            const usuario = document.getElementById('reg-usuario').value;
            const password = document.getElementById('reg-password').value;
            const telefono = document.getElementById('reg-telefono').value;
            const direccion = document.getElementById('reg-direccion').value;
            const rolSeleccionado = parseInt(document.getElementById('reg-rol').value);

            if(!nombre || !usuario || !password) {
                alert("Por favor completa al menos Nombre, Usuario y Contraseña.");
                return;
            }

            try {
                const respuesta = await fetch(`${API_BASE}/usuarios/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nombre: nombre,
                        usuario: usuario,
                        password: password,
                        telefono: telefono,
                        direccion: direccion,
                        id_rol: rolSeleccionado,
                        rol: rolSeleccionado
                    })
                });

                if (respuesta.ok) {
                    alert("¡Usuario registrado con éxito en la base de datos!");
                    cambiarVista('login');
                } else {
                    const errorData = await respuesta.json();
                    alert("Error al registrar: " + (errorData.error || "Datos incompletos"));
                }
            } catch (error) {
                console.error("Error de red:", error);
                alert("No se pudo conectar con el servidor.");
            }
        }
    </script>

</body>
</html>
