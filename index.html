<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeciAlerta - Iniciar Sesión</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fondo con degradado idéntico al diseño */
        .bg-gradient-splash {
            background: linear-gradient(180deg, #581C87 0%, #7E22CE 35%, #D916F0 65%, #FF7F5C 100%);
        }
    </style>
</head>
<body class="bg-gradient-splash min-h-screen flex flex-col justify-between items-center py-8 px-6 font-sans relative overflow-x-hidden">

    <!-- Barra de Estado Falsa (Estilo Móvil) -->
    <div class="w-full max-w-sm flex justify-between items-center text-white font-medium text-sm pt-1 z-10">
        <div>9:16 PM</div>
        <div class="flex items-center space-x-1.5">
            <!-- Iconos de barra de estado -->
            <svg width="17" height="12" viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 10.5C1 9.39543 1.89543 8.5 3 8.5H3.90909C5.01366 8.5 5.90909 9.39543 5.90909 10.5V11C5.90909 11.5523 5.46137 12 4.90909 12H3C2.44772 12 2 11.5523 2 11V10.5C2 10.5 2 10.5 1 10.5Z" fill="white"/><path d="M8.09091 5.5C8.09091 4.39543 8.98634 3.5 10.0909 3.5H11C12.1046 3.5 13 4.39543 13 5.5V11C13 11.5523 12.5523 12 12 12H10.9091C10.3568 12 9.90909 11.5523 9.90909 11V5.5C9.90909 5.5 9.90909 5.5 8.09091 5.5Z" fill="white"/><path d="M13 1C13 0.447715 13.4477 0 14 0H15.0909C15.6432 0 16.0909 0.447715 16.0909 1V11C16.0909 11.5523 15.6432 12 15.0909 12H14C13.4477 12 13 11.5523 13 11V1C13 1 13 1 13 1Z" fill="white"/></svg>
            <svg width="22" height="11" viewBox="0 0 25 11" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="white"/><path d="M23 3.5V7.5" stroke="white" stroke-linecap="round"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="white"/></svg>
        </div>
    </div>

    <!-- Contenedor Principal de la App -->
    <div class="w-full max-w-sm flex flex-col items-center my-auto z-10">
        
        <!-- Círculo con el Ícono del Mapa -->
        <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-xl mb-10">
            <!-- Ícono SVG de Mapa y Ruta -->
            <svg class="w-16 h-16 text-gray-800" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                <!-- Pin de ubicación en el mapa -->
                <circle cx="15" cy="9" r="1.5" fill="currentColor"></circle>
            </svg>
        </div>

        <!-- Formulario de Acceso -->
        <div class="w-full px-4 space-y-5">
            <!-- Campo Usuario -->
            <div>
                <label class="block text-white text-base font-medium mb-1">Usuario:</label>
                <input type="text" id="usuario" class="w-full bg-transparent border-b border-white/60 text-white pb-1 focus:outline-none focus:border-white placeholder-white/40" placeholder="">
            </div>

            <!-- Campo Contraseña -->
            <div>
                <label class="block text-white text-base font-medium mb-1">Contraseña:</label>
                <input type="password" id="password" class="w-full bg-transparent border-b border-white/60 text-white pb-1 focus:outline-none focus:border-white placeholder-white/40" placeholder="">
            </div>

            <!-- Botón Acceso -->
            <div class="pt-4 flex flex-col items-center">
                <button onclick="realizarAcceso()" class="w-48 bg-white text-gray-900 font-medium py-2.5 rounded-xl shadow-md hover:bg-gray-100 transition duration-200">
                    Acceso
                </button>
                <a href="#" class="text-white text-xs mt-2 hover:underline opacity-90">Has olvidado tu contraseña</a>
            </div>

            <!-- Botón Crear Cuenta -->
            <div class="pt-6 flex flex-col items-center">
                <button onclick="irACrear()" class="w-48 bg-white text-gray-900 font-medium py-2.5 rounded-xl shadow-md hover:bg-gray-100 transition duration-200">
                    Crear
                </button>
                <a href="#" class="text-white text-xs mt-2 hover:underline opacity-90">¿No tienes una cuenta?</a>
            </div>
        </div>

    </div>

    <!-- Indicador inferior de iPhone (Barra Home) -->
    <div class="w-32 h-1 bg-white/50 rounded-full mx-auto mt-4 z-10"></div>

    <script>
        // Funciones de ejemplo para los botones
        function realizarAcceso() {
            const user = document.getElementById('usuario').value;
            if(!user) {
                alert("Por favor ingresa tu usuario");
                return;
            }
            alert("Conectando con la API de Render para el usuario: " + user);
            // Aquí puedes conectar el fetch hacia tu API en Flask
        }

        function irACrear() {
            alert("Redirigiendo al formulario de registro...");
        }
    </script>

</body>
</html>
