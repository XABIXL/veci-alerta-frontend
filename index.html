<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeciAlerta - Panel Web</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-6">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-3xl font-bold text-blue-600 mb-4">🏡 VeciAlerta - Reportes de la Comunidad</h1>
        <p class="text-gray-600 mb-6">Esta lista se está consumiendo en tiempo real desde tu API en Render.</p>

        <button onclick="cargarReportes()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition mb-6">
            Actualizar Reportes
        </button>

        <div id="contenedor-reportes" class="space-y-4">
            <p class="text-gray-500">Cargando reportes...</p>
        </div>
    </div>

    <script>
        // URL base de tu API en Render
        const API_URL = "https://veci-alerta-api-1.onrender.com/api/reportes";

        async function cargarReportes() {
            const contenedor = document.getElementById("contenedor-reportes");
            contenedor.innerHTML = `<p class="text-blue-500">Buscando datos...</p>`;

            try {
                const respuesta = await fetch(API_URL);
                const reportes = await respuesta.json();

                if (reportes.length === 0) {
                    contenedor.innerHTML = `<p class="text-gray-500">No hay reportes registrados todavía.</p>`;
                    return;
                }

                // Generar el HTML para cada reporte recibido
                let html = "";
                reportes.forEach(reporte => {
                    html += `
                        <div class="border border-gray-200 p-4 rounded-lg shadow-sm bg-gray-50">
                            <h2 class="text-xl font-semibold text-gray-800">${reporte.titulo || 'Sin título'}</h2>
                            <p class="text-gray-700 mt-1">${reporte.descripcion || 'Sin descripción'}</p>
                            <div class="text-sm text-gray-500 mt-3 flex justify-between">
                                <span>📍 Ubicación: ${reporte.ubicacion || 'No especificada'}</span>
                                <span class="bg-yellow-100 text-yellow-800 px-2 py-0.5 rounded">Estado ID: ${reporte.id_estado}</span>
                            </div>
                        </div>
                    `;
                });

                contenedor.innerHTML = html;

            } catch (error) {
                console.error("Error al conectar con la API:", error);
                contenedor.innerHTML = `<p class="text-red-500">Error al conectar con el servidor.</p>`;
            }
        }

        // Cargar los reportes automáticamente al abrir la página
        cargarReportes();
    </script>

</body>
</html>
